# Peer-B (Responder) StrongSwan swanctl.conf
connections {
   hardened-tunnel {
      version = 2
      local_addrs  = 192.168.100.20
      remote_addrs = 192.168.100.10
      proposals = aes256gcm16-prfsha384-ecp256

      local {
         auth = psk
         id = peer-b@enterprise.secure
      }
      remote {
         auth = psk
         id = peer-a@enterprise.secure
      }

      children {
         hardened-child {
            mode = tunnel
            local_ts = 192.168.100.20/32
            remote_ts = 192.168.100.10/32
            esp_proposals = aes256gcm16-ecp256
            rekey_time = 3600s
            dpd_action = restart
         }
      }
   }
}

secrets {
   ike-hardened {
      id-b = peer-b@enterprise.secure
      id-a = peer-a@enterprise.secure
      secret = "EnterpriseSuperSecretPreSharedKey2026!"
   }
}

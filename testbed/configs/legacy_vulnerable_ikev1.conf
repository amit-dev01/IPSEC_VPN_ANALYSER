# Insecure & Deprecated IPsec Profile (Flagged for Critical Vulnerabilities)
# IKEv1, 3DES-CBC + MD5, DH Group 2 (1024-bit MODP), No PFS, Transport Mode

connections {
   vulnerable-conn {
      version = 1
      local_addrs  = 192.168.100.10
      remote_addrs = 192.168.100.20
      proposals = 3des-md5-modp1024

      local {
         auth = psk
         id = 192.168.100.10
      }
      remote {
         auth = psk
         id = 192.168.100.20
      }

      children {
         vulnerable-child {
            mode = transport
            esp_proposals = 3des-md5
            rekey_time = 86400s # Insecure 24 hour lifetime
            dpd_action = none
         }
      }
   }
}

secrets {
   ike-legacy {
      secret = "weakpsk123"
   }
}

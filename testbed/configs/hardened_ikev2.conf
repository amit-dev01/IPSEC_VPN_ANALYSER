# Hardened Modern IPsec Profile (NIST SP 800-77 & CNSA Compliant)
# IKEv2, AES-256-GCM, DH Group 19 (ECP-256), PFS Enabled, Tunnel Mode

connections {
   hardened-tunnel {
      version = 2
      local_addrs  = 192.168.100.10
      remote_addrs = 192.168.100.20
      proposals = aes256gcm16-prfsha384-ecp256-ecp384

      local {
         auth = psk
         id = peer-a@enterprise.secure
      }
      remote {
         auth = psk
         id = peer-b@enterprise.secure
      }

      children {
         hardened-child {
            mode = tunnel
            esp_proposals = aes256gcm16-ecp256
            rekey_time = 3600s
            rekey_bytes = 1073741824 # 1GB
            dpd_action = restart
         }
      }
   }
}

secrets {
   ike-hardened {
      secret = "EnterpriseSuperSecretPreSharedKey2026!"
   }
}

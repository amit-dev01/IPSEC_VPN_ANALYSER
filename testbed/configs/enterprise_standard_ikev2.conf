# Enterprise Standard IPsec Profile
# IKEv2, AES-128-CBC + HMAC-SHA256, DH Group 14 (2048-bit MODP), PFS Enabled, Tunnel Mode

connections {
   enterprise-conn {
      version = 2
      local_addrs  = 192.168.100.10
      remote_addrs = 192.168.100.20
      proposals = aes128-sha256-modp2048

      local {
         auth = psk
         id = peer-a@standard.corp
      }
      remote {
         auth = psk
         id = peer-b@standard.corp
      }

      children {
         enterprise-child {
            mode = tunnel
            esp_proposals = aes128-sha256-modp2048
            rekey_time = 14400s # 4 hours
            dpd_action = restart
         }
      }
   }
}

secrets {
   ike-enterprise {
      secret = "StandardEnterpriseKey2026_SecureVault"
   }
}
